<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLUE</title>
  <style>
    :root { --accent: #3b82f6; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #0b1020; color: #dbeafe; }
    .card { border: 2px solid var(--accent); border-radius: 14px; padding: 36px 48px;
            background: #0f172a; box-shadow: 0 0 60px rgba(59,130,246,.25); text-align: center; }
    h1 { margin: 0; font-size: 4rem; letter-spacing: .1em; color: var(--accent); }
    p  { margin: 12px 0 0; color: #93c5fd; font-size: .95rem; }
    code { font-family: ui-monospace, monospace; color: #bfdbfe; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BLUE</h1>
    <p>target group <code>s3-blue-tg</code> &middot; <code>us-east-1b</code></p>
    <p>served from <code>/blue/</code></p>
  </div>
</body>
</html>
