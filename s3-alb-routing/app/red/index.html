<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED</title>
  <style>
    :root { --accent: #ef4444; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #1a0b0b; color: #fee2e2; }
    .card { border: 2px solid var(--accent); border-radius: 14px; padding: 36px 48px;
            background: #2a0f0f; box-shadow: 0 0 60px rgba(239,68,68,.25); text-align: center; }
    h1 { margin: 0; font-size: 4rem; letter-spacing: .1em; color: var(--accent); }
    p  { margin: 12px 0 0; color: #fca5a5; font-size: .95rem; }
    code { font-family: ui-monospace, monospace; color: #fecaca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RED</h1>
    <p>target group <code>s3-red-tg</code> &middot; <code>us-east-1a</code></p>
    <p>served from <code>/red/</code></p>
  </div>
</body>
</html>
